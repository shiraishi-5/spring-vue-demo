<!DOCTYPE html>
<html xmln:th="http://www.thymeleaf.org">
<html>

<head>
	<meta charset="UTF-8">
	<title>Prac1　簡易登録フォーム</title>
</head>

<body>
	<form th:action="@{/submit}" th:object="${userForm}" method="post">
		<label for="userName">名前</label>
		<input type="text" th:field="*{name}" id="userName">
		<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

		<label for="userAge">年齢</label>
		<input type="number" th:field="*{age}" id="userAge">
		<div th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>

		
		<button type="submit">送信</button>
	</form>
</body>

</html>
